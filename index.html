<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Карточки английских слов: перевод, примеры, произношение, тренировки и интервальные повторения.">
<meta name="theme-color" content="#D4EE26">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='20' height='20' rx='6' fill='%23F7A9DD' transform='rotate(-12 13 18)'/%3E%3Crect x='9' y='4' width='20' height='20' rx='6' fill='%23D4EE26' stroke='%2323285A' stroke-width='2' transform='rotate(6 19 14)'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Колода слов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* Layout: Urban.Lab-like — white page, big rounded grey tiles, lime + pink accents, navy type, pill buttons; one 1040px column, tabs top on desktop / bottom bar on phones. */
:root{
  --bg:#FFFFFF; --surface:#F2F2F7; --surface-2:#FFFFFF; --line:#E2E2EC;
  --ink:#23285A; --muted:#6E7296;
  --accent:#D4EE26; --accent-ink:#23285A; --accent-soft:#F0F9C2;
  --pink:#F7A9DD; --pink-ink:#23285A; --pink-strong:#E0399F;
  --mark:#F7A9DD; --mark-ink:#23285A;
  --good:#1E9E5E; --good-soft:#EAF8C9; --bad:#D9356F; --bad-soft:#FDE4F0;
  --hero-base:#2A2E6E; --hero-ink:#FFFFFF;
  --shadow:0 2px 4px rgba(35,40,90,.05),0 12px 30px rgba(35,40,90,.08);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ipa:"Segoe UI","Noto Sans","Helvetica Neue",Arial,sans-serif;
  --r:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11132A; --surface:#1C1F3F; --surface-2:#262A50; --line:#30355F;
  --ink:#F1F2FF; --muted:#A3A7CC;
  --accent:#D4EE26; --accent-ink:#1A1D3B; --accent-soft:#3A4318;
  --pink:#F29AD3; --pink-ink:#1A1D3B; --pink-strong:#FF7CCB;
  --mark:#F29AD3; --mark-ink:#1A1D3B;
  --good:#8BDB5A; --good-soft:#26391D; --bad:#FF6B9A; --bad-soft:#47213A;
  --hero-base:#1F2260; --hero-ink:#FFFFFF;
  --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11132A; --surface:#1C1F3F; --surface-2:#262A50; --line:#30355F;
  --ink:#F1F2FF; --muted:#A3A7CC;
  --accent:#D4EE26; --accent-ink:#1A1D3B; --accent-soft:#3A4318;
  --pink:#F29AD3; --pink-ink:#1A1D3B; --pink-strong:#FF7CCB;
  --mark:#F29AD3; --mark-ink:#1A1D3B;
  --good:#8BDB5A; --good-soft:#26391D; --bad:#FF6B9A; --bad-soft:#47213A;
  --hero-base:#1F2260; --hero-ink:#FFFFFF;
  --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink-strong);outline-offset:2px}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.ipa{font-family:var(--f-ipa);color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center}
.logo{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;letter-spacing:.04em;padding:9px 16px;border-radius:999px;text-transform:uppercase}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink)}
.sync.cloud::before{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.top .tabs{margin:0}

.tabs{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:5px}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tabs button svg{width:17px;height:17px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:759px){
  .top .tabs{position:fixed;left:0;right:0;bottom:0;border-radius:24px 24px 0 0;z-index:6;background:var(--surface);box-shadow:0 -6px 20px rgba(35,40,90,.08);
    padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  .tabs button{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:7px 4px;border-radius:16px}
  .tabs button svg{width:20px;height:20px}
}

/* generic */
.panel{background:var(--surface);border-radius:var(--r);padding:22px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:10px 22px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;transition:transform .12s,filter .12s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover,.btn.mark:hover,.btn.pink:hover{filter:brightness(1.04);border-color:transparent}
.btn.mark,.btn.pink{background:var(--pink);border-color:var(--pink);color:var(--pink-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.wide{width:100%}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface-2);display:inline-grid;place-items:center;cursor:pointer;flex:none;color:var(--ink);box-shadow:0 1px 3px rgba(35,40,90,.08)}
.icon-btn:hover{background:var(--accent);color:var(--accent-ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm svg{width:15px;height:15px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:16px;padding:11px 16px;min-height:46px;outline:none;font-weight:500}
.input:focus{border-color:var(--ink)}
textarea.input{min-height:100px;resize:vertical;line-height:1.45}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.lang{font-size:10.5px;letter-spacing:.06em;background:var(--pink);color:var(--pink-ink)}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* section heading like "ЗАЛЫ, ГДЕ РАБОТАТЬ…" */
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px}
.sec-head h2{font-size:clamp(19px,3vw,26px);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.25;max-width:22ch}
.pill-link{border:0;background:var(--pink);color:var(--pink-ink);font-weight:700;font-size:12px;padding:9px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;flex:none}
.pill-link:hover{filter:brightness(1.04)}

/* hero */
.hero{position:relative;border-radius:30px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;padding:20px;
  background:radial-gradient(520px 340px at 92% 8%,color-mix(in srgb,var(--accent) 75%,transparent),transparent 70%),
             radial-gradient(460px 360px at 70% 105%,color-mix(in srgb,var(--pink) 85%,transparent),transparent 70%),
             radial-gradient(400px 300px at 0% 0%,color-mix(in srgb,var(--pink-strong) 45%,transparent),transparent 70%),var(--hero-base);
  color:var(--hero-ink);min-height:320px}
.hero-glass{background:rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:30px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.hero-kicker{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;opacity:.85}
.hero-title{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,8vw,78px);line-height:1;letter-spacing:-.03em;color:var(--hero-ink)}
.hero-title span{color:var(--pink)}
.hero p{margin:0;max-width:34ch;font-size:14px;opacity:.9}
.hero .row{justify-content:center}
.hero .btn.primary{min-width:200px}
.hero .btn.ghost{color:var(--hero-ink);opacity:.85}
.hero-art{position:relative;min-height:260px}
.hc{position:absolute;width:min(58%,230px);aspect-ratio:1.45;border-radius:22px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;box-shadow:0 18px 40px rgba(10,12,40,.35);color:#23285A}
.hc b{font-size:clamp(18px,2.6vw,26px);font-weight:800;line-height:1.1}
.hc i{font-style:normal;font-family:var(--f-ipa);font-size:13px;opacity:.7}
.hc1{background:#FFFFFF;top:10%;left:6%;transform:rotate(-8deg);z-index:2}
.hc2{background:#D4EE26;top:38%;left:40%;transform:rotate(6deg);z-index:3}
.hc3{background:#F7A9DD;top:2%;right:2%;transform:rotate(12deg);z-index:1;width:min(44%,170px)}
.hc .dot{position:absolute;top:16px;right:16px;width:26px;height:26px;border-radius:50%;background:#23285A;display:grid;place-items:center}
.hc .dot svg{width:13px;height:13px;color:#fff}
@media (max-width:700px){.hero{grid-template-columns:1fr;padding:14px}.hero-art{min-height:200px;order:-1}.hero-glass{padding:24px 18px}}

/* feature tiles */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid3,.grid2{grid-template-columns:1fr}}
.ftile{position:relative;overflow:hidden;border-radius:var(--r);padding:22px;background:var(--surface);display:flex;flex-direction:column;gap:10px;min-height:200px}
.ftile h3{font-size:19px;font-weight:700;position:relative;z-index:1}
.ftile p{margin:0;font-size:13px;color:var(--muted);max-width:30ch;position:relative;z-index:1}
.ftile .btn{margin-top:auto;align-self:flex-start;position:relative;z-index:1}
.ftile.lime{background:var(--accent);color:var(--accent-ink)}
.ftile.lime p,.ftile.lime .label{color:var(--accent-ink);opacity:.75}
.ftile.pinky{background:var(--pink);color:var(--pink-ink)}
.ftile.pinky p,.ftile.pinky .label{color:var(--pink-ink);opacity:.75}
.ftile.wide2{grid-column:span 2}
@media (max-width:560px){.ftile.wide2{grid-column:auto}}
.ftile .lime .btn,.ftile.lime .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.ftile.pinky .btn{background:var(--pink-ink);color:var(--pink);border-color:var(--pink-ink)}
.bignum{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.bigline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
/* decorative 3D-ish objects drawn in CSS */
.deco{position:absolute;pointer-events:none}
.deco.ring{width:150px;height:150px;border-radius:50%;right:-36px;bottom:-46px;border:26px solid var(--accent-ink);opacity:.9}
.deco.ring::after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--pink);box-shadow:inset -10px -12px 0 rgba(0,0,0,.12)}
.deco.stackc{right:18px;bottom:18px;width:96px;height:70px}
.deco.stackc i{position:absolute;inset:0;border-radius:14px;box-shadow:0 8px 18px rgba(35,40,90,.18)}
.deco.stackc i:nth-child(1){background:var(--pink);transform:rotate(-12deg) translate(-10px,4px)}
.deco.stackc i:nth-child(2){background:var(--accent);transform:rotate(4deg)}
.deco.stackc i:nth-child(3){background:#fff;transform:rotate(14deg) translate(12px,-6px)}
.deco.bubble{right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,transparent 9%),radial-gradient(circle at 40% 40%,var(--accent),color-mix(in srgb,var(--accent) 60%,#000) 100%);opacity:.95}
.streak{display:flex;gap:5px;margin-top:4px;position:relative;z-index:1}
.streak span{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.55)}
.streak span.on{background:var(--pink-ink)}
.wordtile{background:var(--surface);border-radius:20px;padding:16px 18px;display:flex;gap:12px;align-items:center}
.wordtile .w{min-width:0;flex:1}
.wordtile b{display:block;font-weight:700;overflow-wrap:anywhere}
.wordtile span{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.empty{text-align:center;padding:28px 18px}

/* add word */
.add-head{display:flex;gap:10px;align-items:stretch}
.add-head .input{font-size:17px}
.add-head .btn{flex:none}
.lang-badge{align-self:center}
.senses{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.sense{border:2px solid transparent;border-radius:18px;padding:14px 16px;background:var(--surface-2);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.sense:hover{border-color:var(--line)}
.sense[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sense .t{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sense .ex{font-size:13px;color:var(--muted);font-style:italic}
.preview{border-radius:20px;padding:18px;background:var(--surface-2);border:2px dashed var(--line)}
.ex-list{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.ex-list li{display:flex;gap:10px;align-items:flex-start}
.ex-list .en{font-weight:600}
.ex-list .ru{color:var(--muted);font-size:13px}
.skeleton{height:64px;border-radius:18px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
details.imp summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.imp summary::-webkit-details-marker{display:none}
details.imp summary::after{content:"+";font-size:20px;width:28px;height:28px;border-radius:50%;background:var(--pink);color:var(--pink-ink);display:grid;place-items:center;line-height:1}
details.imp[open] summary::after{content:"−"}

/* list */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:0;background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wlist{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden;padding:6px}
.witem{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.witem:hover{background:var(--surface-2)}
.witem .w{min-width:0}
.witem .w b{font-weight:700;display:block;overflow-wrap:anywhere}
.witem .w span{color:var(--muted);font-size:13px;display:block;overflow-wrap:anywhere}
.boxes{display:flex;gap:3px}
.boxes i{width:6px;height:16px;border-radius:3px;background:var(--line)}
.boxes i.on{background:var(--ink)}
.boxes.known i.on{background:var(--good)}
.nextdue{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;font-weight:600}
.nextdue.due{color:var(--pink-ink);background:var(--pink);padding:3px 10px;border-radius:999px}
@media (max-width:480px){.witem{grid-template-columns:auto 1fr auto}.witem .nextdue{display:none}}

/* progress */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border-radius:22px;padding:18px}
.kpi:nth-child(2){background:var(--accent);color:var(--accent-ink)}
.kpi:nth-child(3){background:var(--pink);color:var(--pink-ink)}
.kpi b{font-family:var(--f-display);font-weight:800;font-size:34px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;font-weight:600;opacity:.75}
.stackbar{display:flex;height:18px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stackbar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:140px;padding-top:18px;border-bottom:1.5px solid var(--line)}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:100%;max-width:34px;border-radius:999px 999px 6px 6px;background:var(--ink);min-height:3px}
.bar i.today{background:var(--pink-strong)}
.bar em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.bar-labels{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;font-size:10.5px;color:var(--muted);text-align:center;margin-top:6px;font-weight:600}

/* settings */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-block:14px;border-top:1.5px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow .lbl{min-width:0}
.setrow .lbl b{display:block;font-weight:700}
.setrow .lbl span{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;flex:none}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface-2);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px);background:var(--accent-ink)}
.switch input:focus-visible+span{outline:2px solid var(--pink-strong);outline-offset:2px}
.range{display:flex;align-items:center;gap:10px;flex:none}
.range input{width:140px;accent-color:var(--pink-strong)}
.range output{font-family:var(--f-display);font-weight:800;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}

/* session overlay */
.sess{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sess-top{display:flex;align-items:center;gap:12px;max-width:660px;width:100%;margin:0 auto}
.sess-top .icon-btn{background:var(--surface);box-shadow:none}
.pbar{flex:1;height:12px;border-radius:999px;background:var(--surface);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:999px;transition:width .3s}
.sess-count{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.sess-body{flex:1;display:flex;flex-direction:column;max-width:660px;width:100%;margin:0 auto;padding-top:20px;gap:16px}
.mode-tag{display:flex;align-items:center;gap:8px}
.mode-tag .label{background:var(--accent);color:var(--accent-ink);padding:6px 14px;border-radius:999px;letter-spacing:.06em}
.flash{background:var(--surface);border-radius:28px;padding:28px 22px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;position:relative;overflow:hidden}
.flash .word{font-size:clamp(28px,7vw,44px);font-weight:800;line-height:1.12;overflow-wrap:anywhere;letter-spacing:-.02em}
.flash .trans{font-size:20px;font-weight:600;overflow-wrap:anywhere}
.flash hr{width:64px;border:0;border-top:4px solid var(--pink);border-radius:4px;margin:4px 0}
.flash .ex-list{text-align:left;width:100%;max-width:500px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid transparent;background:var(--surface);border-radius:20px;padding:16px 18px;min-height:60px;text-align:left;cursor:pointer;font-weight:600;font-size:16px;display:flex;gap:12px;align-items:center;overflow-wrap:anywhere}
.opt kbd{font-family:var(--f-display);font-size:11px;font-weight:700;background:var(--surface-2);border-radius:999px;padding:3px 9px;color:var(--muted);flex:none}
.opt:hover:not([disabled]){border-color:var(--line)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--pink-strong);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
@media (hover:none){.opt kbd,.btn kbd{display:none}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mitem{border:2px solid transparent;background:var(--surface);border-radius:18px;padding:12px;min-height:60px;cursor:pointer;font-weight:600;overflow-wrap:anywhere;text-align:center;transition:opacity .25s,transform .15s}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.mitem.done{opacity:0;pointer-events:none;transform:scale(.94)}
.mitem.err{border-color:var(--pink-strong);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:48px}
.slot{width:34px;height:46px;border-bottom:4px solid var(--line);display:grid;place-items:center;font-size:24px;font-weight:700;text-transform:lowercase}
.slot.fill{border-color:var(--accent)}
.slot.gap{width:14px;border:0}
.slot.fixed{border-color:transparent;color:var(--muted)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile-l,.tiles .tile{width:48px;height:52px;min-height:0;padding:0;border-radius:16px;border:0;background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line);display:grid;place-items:center;color:var(--ink)}
.tiles .tile:hover{background:var(--accent-soft)}
.tiles .tile.err{background:var(--bad-soft);animation:shake .3s}
.tiles .tile.hint{background:var(--pink);color:var(--pink-ink)}
.type-in{font-size:20px;text-align:center;font-weight:700;border-radius:999px}
.type-in.right{border-color:var(--accent);background:var(--accent-soft)}
.type-in.wrong{border-color:var(--pink-strong);background:var(--bad-soft)}
.feedback{border-radius:18px;padding:14px 16px;font-weight:600}
.feedback.ok{background:var(--accent-soft);color:var(--ink)}
.feedback.no{background:var(--bad-soft);color:var(--ink)}
.feedback b{color:var(--ink)}
.context{font-size:14px;color:var(--muted);text-align:center;font-style:italic}
.sess-foot{display:flex;gap:10px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.sess-foot .btn{flex:1}
.sum-list{display:grid;gap:8px}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:16px;background:var(--surface);font-size:14px}
.sum-row b{font-weight:700;overflow-wrap:anywhere}
.sum-row .ok{color:var(--good);font-weight:600} .sum-row .no{color:var(--bad);font-weight:600}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:30;background:rgba(17,19,42,.5);display:grid;place-items:center;padding:16px}
.modal .panel{width:100%;max-width:540px;max-height:90vh;overflow-y:auto;background:var(--bg);box-shadow:var(--shadow);border-radius:28px}
.modal .input{background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">Колода</span></div>
    <nav class="tabs" id="tabs" aria-label="Разделы">
    <button data-view="learn" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Учить</button>
    <button data-view="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Слова</button>
    <button data-view="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Прогресс</button>
    <button data-view="prefs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Настройки</button>
  </nav>
    <div class="sync" id="sync">этот браузер</div>
  </header>

  <main>
    <section id="v-learn" class="stack"></section>
    <section id="v-words" class="stack" hidden>
      <div class="panel stack" id="addPanel">
        <div class="row" style="justify-content:space-between"><h2 style="font-size:20px;font-weight:800;text-transform:uppercase">Новая карточка</h2><span class="chip lang lang-badge" id="langBadge" hidden>EN</span></div>
        <form id="addForm" class="add-head">
          <input class="input" id="addInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Слово или фраза: to set off, справляться…" aria-label="Слово или фраза">
          <button class="btn primary" id="lookupBtn" type="submit">Найти</button>
        </form>
        <div id="addResult" class="stack"></div>
        <details class="imp">
          <summary>Добавить списком</summary>
          <div class="stack" style="margin-top:12px">
            <p class="muted small" style="margin:0">По одной паре в строке: <b>слово — перевод</b>. Разделитель: тире, дефис с пробелами, табуляция или «;».</p>
            <textarea class="input" id="impText" placeholder="to cope with — справляться с&#10;receipt — чек&#10;jealous — ревнивый, завистливый"></textarea>
            <div class="row" style="justify-content:space-between">
              <label class="row small muted" style="gap:8px"><span class="switch"><input type="checkbox" id="impEx" checked><span></span></span>подобрать примеры и транскрипцию</label>
              <button class="btn" id="impBtn" type="button">Импортировать</button>
            </div>
          </div>
        </details>
        <p class="small muted" id="srcNote" style="margin:0"></p>
      </div>
      <div class="sec-head"><h2>Моя колода</h2><button class="pill-link" type="button" id="toLearn">Учить</button></div>
      <div class="row" style="justify-content:space-between">
        <input class="input" id="search" placeholder="Поиск по колоде" style="flex:1;min-width:180px" aria-label="Поиск">
      </div>
      <div class="filters" id="filters">
        <button data-f="all" aria-pressed="true">Все</button>
        <button data-f="new" aria-pressed="false">Новые</button>
        <button data-f="learning" aria-pressed="false">Учу</button>
        <button data-f="known" aria-pressed="false">Выучено</button>
        <button data-f="due" aria-pressed="false">К повторению</button>
      </div>
      <div id="wlist"></div>
    </section>
    <section id="v-stats" class="stack" hidden></section>
    <section id="v-prefs" class="stack" hidden></section>
  </main>
</div>

<div class="sess" id="sess" hidden>
  <div class="sess-top">
    <button class="icon-btn" id="sessClose" aria-label="Выйти из тренировки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="pbar"><i id="pbar" style="width:0"></i></div>
    <div class="sess-count" id="sessCount">0/0</div>
  </div>
  <div class="sess-body" id="sessBody"></div>
</div>

<div class="modal" id="modal" hidden><div class="panel stack" id="modalBody"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ============ utils ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 86400000;
const INTERVALS = [0, 1, 3, 7, 16, 35, 80, 180]; // дни для коробок 1..7
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const startOfDay = (t=Date.now()) => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const dayKey = (t=Date.now()) => { const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const isCyr = s => /[а-яё]/i.test(s);
const uid = () => "c-" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
function plural(n, one, few, many){ const m10=n%10, m100=n%100; if(m10===1&&m100!==11) return one; if(m10>=2&&m10<=4&&(m100<12||m100>14)) return few; return many; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 2600); }
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
const norm = s => String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/ё/g,"е").replace(/[.!?,;:]+$/,"").replace(/\s+/g," ").trim();
function lsGet(k, d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }

/* ============ store ============ */
const DEFAULTS = { batch:10, first:"en", audio:"en", rate:0.9, voice:"", native:true, mmEmail:"", modes:{choice:true, match:true, letters:true, typing:true} };
const Store = {
  cloud:false, col:null, cards:new Map(), settings:structuredClone(DEFAULTS), stats:{days:{}},
  loadLocal(){
    const cs = lsGet("koloda.cards", []); this.cards = new Map(cs.map(c=>[c.id,c]));
    this.settings = Object.assign(structuredClone(DEFAULTS), lsGet("koloda.settings", {}));
    this.settings.modes = Object.assign({}, DEFAULTS.modes, this.settings.modes||{});
    this.stats = lsGet("koloda.stats", {days:{}});
  },
  saveLocal(){ lsSet("koloda.cards",[...this.cards.values()]); lsSet("koloda.settings",this.settings); lsSet("koloda.stats",this.stats); },
  async connect(){
    if(!window.claude?.use) return;
    try{
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if(!db || !user) return;
      const canWrite = await user.can("data.write").catch(()=>null);
      if(canWrite===false) return; // гости по публичной ссылке: колода в этом браузере
      const id = await user.id(); if(!id) return;
      const col = db.collection("data/users/" + id);
      const snap = await col.limit(1000).get();
      const remote = new Map(); let settings=null, stats=null;
      snap.docs.forEach(d=>{ const v=d.data(); if(!v) return; if(d.id==="settings") settings=v; else if(d.id==="stats") stats=v; else if(d.id.startsWith("c-")) remote.set(d.id, v); });
      this.col = col; this.cloud = true;
      if(remote.size===0 && this.cards.size>0){ // перенос локальной колоды в облако
        for(const c of this.cards.values()) await this.col.doc(c.id).set(c).catch(()=>{});
        await this.col.doc("settings").set(this.settings).catch(()=>{});
        await this.col.doc("stats").set(this.stats).catch(()=>{});
      } else {
        this.cards = remote;
        if(settings){ this.settings = Object.assign(structuredClone(DEFAULTS), settings); this.settings.modes = Object.assign({}, DEFAULTS.modes, settings.modes||{}); }
        if(stats) this.stats = stats;
        this.saveLocal();
      }
    }catch(e){ this.cloud=false; this.col=null; }
  },
  write(id, data){
    this.saveLocal();
    if(!this.cloud) return;
    this.col.doc(id).set(data).catch(e=>{
      if(e?.code==="invalid_argument"||e?.code==="revoked"||e?.code==="not_granted"){ this.cloud=false; setSync(); }
      else if(e?.code==="quota_exceeded") toast("Хранилище заполнено: удалите часть карточек");
    });
  },
  saveCard(c){ this.cards.set(c.id,c); this.write(c.id,c); },
  deleteCard(id){ this.cards.delete(id); this.saveLocal(); if(this.cloud) this.col.doc(id).delete().catch(()=>{}); },
  saveSettings(){ this.write("settings", this.settings); },
  saveStats(){ this.write("stats", this.stats); },
};
const S = () => Store.settings;
function setSync(){ const el=$("#sync"); el.textContent = Store.cloud ? "синхронизировано" : "этот браузер"; el.classList.toggle("cloud", Store.cloud); el.title = Store.cloud ? "Колода хранится в вашем аккаунте и доступна с других устройств" : "Колода хранится только в этом браузере"; }

/* ============ cards ============ */
function newCard(f){ return { id:uid(), en:f.en.trim(), ru:f.ru.trim(), ipa:f.ipa||"", pos:f.pos||"", note:f.note||"", audio:f.audio||"", examples:f.examples||[], created:Date.now(), box:0, due:0, reps:0, lapses:0, last:0, demo:!!f.demo }; }
const status = c => !c.box ? "new" : (c.box>=4 ? "known" : "learning");
const isDue = c => c.box>0 && c.due <= Date.now();
const allCards = () => [...Store.cards.values()];
function dueLabel(c){
  if(!c.box) return "новое";
  if(isDue(c)) return "сегодня";
  const d = Math.round((startOfDay(c.due)-startOfDay())/DAY);
  return d===1 ? "завтра" : "через " + d + " " + plural(d,"день","дня","дней");
}
function boxesHtml(c){ const k=status(c)==="known"; let h=`<span class="boxes${k?" known":""}" title="Уровень ${c.box} из 7">`; for(let i=1;i<=7;i++) h+=`<i class="${i<=c.box?"on":""}"></i>`; return h+"</span>"; }

/* ============ speech ============ */
let voices=[];
function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch{} }
if("speechSynthesis" in window){ loadVoices(); try{ speechSynthesis.addEventListener("voiceschanged", ()=>{ loadVoices(); if(view==="prefs") renderPrefs(); }); }catch{} }
function pickVoice(lang){
  if(lang==="en") return voices.find(v=>v.voiceURI===S().voice) || voices.find(v=>/en[-_]GB/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
  return voices.find(v=>/^ru/i.test(v.lang));
}
let warnedNoSpeech=false, audioEl=null;
function speak(text, lang="en"){
  if(lang==="en" && S().native!==false){
    const url=audioFor(text);
    if(url){ try{ speechSynthesis?.cancel(); }catch{} try{ audioEl?.pause(); audioEl=new Audio(url); audioEl.playbackRate=S().rate; audioEl.play().catch(()=>tts(text,lang)); return; }catch{} }
  }
  tts(text,lang);
}
function tts(text, lang){
  if(!("speechSynthesis" in window)){ if(!warnedNoSpeech){ toast("Этот браузер не умеет озвучивать текст"); warnedNoSpeech=true; } return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(lang); if(v) u.voice=v;
    u.lang = v?.lang || (lang==="en"?"en-GB":"ru-RU"); u.rate = S().rate;
    speechSynthesis.speak(u);
  }catch{}
}
function autoSpeak(text, lang){ const a=S().audio; if(a==="off") return; if(lang==="ru" && a!=="both") return; speak(text, lang); }
document.addEventListener("click", e=>{ const b=e.target.closest("[data-say]"); if(b){ e.stopPropagation(); speak(b.dataset.say, b.dataset.lang||"en"); } }, true);
const sayBtn = (text, lang="en", sm=true) => `<button type="button" class="icon-btn${sm?" sm":""}" data-say="${esc(text)}" data-lang="${lang}" aria-label="Произнести">${SPK}</button>`;

/* ============ lookup sources ============ */
let samplePromise=null;
const getSample = () => (samplePromise ||= (window.claude?.use ? claude.use("sample") : Promise.resolve(null)));
let SOURCE = window.claude?.use ? "claude" : "free"; // уточняется после getSample()
getSample().then(s=>{ SOURCE = s ? "claude" : "free"; renderSourceNote(); if(view==="prefs") renderPrefs(); });
function renderSourceNote(){
  const el=$("#srcNote"); if(!el) return;
  el.innerHTML = SOURCE==="claude"
    ? "Переводы и примеры подбирает Claude."
    : 'Переводы: <a href="https://mymemory.translated.net" target="_blank" rel="noopener">MyMemory</a> · словарь, транскрипция и аудио: <a href="https://dictionaryapi.dev" target="_blank" rel="noopener">Free Dictionary API</a>';
}

/* Free Dictionary API + MyMemory */
const FREE = {
  async translate(q, from, to){
    const em=(S().mmEmail||"").trim();
    const u="https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair="+from+"|"+to+(em?"&de="+encodeURIComponent(em):"");
    let r; try{ r=await fetch(u); }catch{ throw {code:"net"}; }
    if(!r.ok) throw {code: r.status===429?"quota":"net"};
    const j=await r.json();
    if(j.responseStatus && +j.responseStatus!==200) throw {code:/quota|limit|429/i.test(String(j.responseDetails)+j.responseStatus)?"quota":"net"};
    if(/MYMEMORY WARNING/i.test(j.responseData?.translatedText||"")) throw {code:"quota"};
    return j;
  },
  variants(j, src){
    const out=[]; const lower = src===src.toLowerCase();
    const add=t=>{ t=String(t||"").replace(/\s+/g," ").trim().replace(/[.!]+$/,""); if(!t||norm(t)===norm(src)||t.length>80) return; if(lower && t!==t.toUpperCase()) t=t.charAt(0).toLowerCase()+t.slice(1); if(!out.some(x=>norm(x)===norm(t))) out.push(t); };
    add(j.responseData?.translatedText);
    (j.matches||[]).filter(m=>+m.match>=0.7 && norm(m.segment)===norm(src)).sort((a,b)=>(+b.quality||0)-(+a.quality||0)).forEach(m=>add(m.translation));
    return out.slice(0,6);
  },
  async dict(word){
    const w=String(word).trim().replace(/^to\s+/i,"");
    let r; try{ r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w)); }catch{ return null; }
    if(!r.ok) return null;
    const j=await r.json(); if(!Array.isArray(j)) return null;
    const phon=j.flatMap(e=>e.phonetics||[]);
    let ipa=j.find(e=>e.phonetic)?.phonetic || phon.find(p=>p.text)?.text || "";
    if(ipa && !ipa.startsWith("/")) ipa="/"+ipa.replace(/^\[|\]$/g,"")+"/";
    const auds=phon.map(p=>p.audio).filter(Boolean);
    const audio=auds.find(a=>/-uk\.mp3/.test(a)) || auds.find(a=>/-us\.mp3/.test(a)) || auds[0] || "";
    const meanings=j.flatMap(e=>e.meanings||[]).map(m=>({pos:m.partOfSpeech, defs:(m.definitions||[]).slice(0,3).map(d=>({def:d.definition, ex:d.example||""}))}));
    const examples=meanings.flatMap(m=>m.defs.filter(d=>d.ex).map(d=>d.ex)).slice(0,2).map(e=>({en:e, ru:""}));
    return {ipa, audio, meanings, examples, pos: meanings.length===1 ? meanings[0].pos : (meanings[0]?.pos||"")};
  },
  async translateExamples(exs){
    for(const x of exs){ if(x.ru) continue; try{ x.ru = (await this.translate(x.en,"en","ru")).responseData?.translatedText || ""; }catch(e){ if(e.code==="quota") break; } }
    return exs;
  },
};
const draftAudio=new Map();
function audioFor(text){ const n=norm(text); return draftAudio.get(n) || allCards().find(c=>c.audio && norm(c.en)===n)?.audio || ""; }
async function askJSON(prompt, tier="default"){
  const sample = await getSample();
  if(!sample) throw {code:"none"};
  return sample.json(prompt, {modelTier:tier});
}
function lookupPrompt(text, lang){
  return `You are a bilingual English–Russian learner's dictionary in the style of the Cambridge English–Russian Dictionary.
Entry (${lang==="ru"?"Russian":"English"}): "${text}"

Reply with ONLY a JSON object of this shape:
{"senses":[{"en":"English word or phrase","ru":"русский перевод","ipa":"/British IPA of the English/","pos":"noun|verb|phrasal verb|adjective|adverb|phrase|idiom|...","meaning":"короткое пояснение значения по-русски, до 8 слов","level":"A1|A2|B1|B2|C1|C2","examples":[{"en":"natural example sentence","ru":"перевод примера"},{"en":"...","ru":"..."}]}]}

Rules:
- 2 to 6 senses, most common first; each sense is a genuinely different meaning or a different English equivalent, not a synonym list.
- ${lang==="ru" ? 'Each "ru" stays close to the entry; "en" is the English equivalent for that meaning.' : 'Each "en" is the entry itself (keep "to" for verbs if the entry has it, or the exact phrasal form); "ru" is the translation for that meaning, up to 3 comma-separated variants.'}
- Exactly 2 examples per sense: everyday British English, under 14 words, each containing the English word or phrase (inflected forms allowed), with natural Russian translations.
- If the entry is misspelt, use the most likely intended word.`;
}
function examplesPrompt(pairs){
  return `You are an English–Russian learner's dictionary. For each numbered pair, give the British IPA transcription of the English and 2 natural everyday British English example sentences (under 14 words, containing the English word or phrase in the meaning of the given Russian translation) with Russian translations.

Pairs:
${pairs.map((p,i)=>`${i}. ${p.en} — ${p.ru}`).join("\n")}

Reply with ONLY a JSON array: [{"i":0,"ipa":"/.../","pos":"noun|verb|...","examples":[{"en":"...","ru":"..."},{"en":"...","ru":"..."}]}]`;
}
function lookupErrorText(e){
  if(e?.code==="quota") return "Дневной лимит переводчика MyMemory исчерпан. Укажите email в настройках (лимит вырастет в 10 раз) или введите перевод вручную.";
  if(e?.code==="net") return "Нет связи со словарём. Проверьте интернет или введите перевод вручную.";
  if(e?.code==="none") return "Автоподбор сейчас недоступен. Введите перевод вручную ниже.";
  if(e?.code==="not_granted") return "Без разрешения на запросы к Claude подбор недоступен. Введите перевод вручную.";
  if(e?.code==="rate_limited") return "Слишком много запросов подряд. Подождите минуту или введите перевод вручную.";
  return "Не получилось подобрать перевод. Попробуйте ещё раз или введите вручную.";
}

/* ============ add flow ============ */
let addState = null;
const addInput = $("#addInput");
addInput.addEventListener("input", ()=>{
  const v=addInput.value.trim(), b=$("#langBadge");
  b.hidden=!v; b.textContent = isCyr(v) ? "RU → EN" : "EN → RU";
});
$("#addForm").addEventListener("submit", e=>{ e.preventDefault(); lookup(); });

async function lookup(){
  const text = addInput.value.trim(); if(!text) { addInput.focus(); return; }
  const lang = isCyr(text) ? "ru" : "en";
  const dup = allCards().find(c => norm(lang==="ru"?c.ru:c.en)===norm(text));
  addState = { text, lang, senses:null, sel:-1, loading:true, error:null, dup };
  renderAdd();
  try{
    let senses;
    if(await getSample()){
      const r = await askJSON(lookupPrompt(text, lang));
      senses = (r?.senses||[]).filter(s=>s && s.en && s.ru).slice(0,6).map(s=>({...s, examples:(s.examples||[]).filter(x=>x&&x.en).slice(0,3)}));
    } else if(lang==="en"){
      const [tr, d] = await Promise.all([FREE.translate(text,"en","ru"), FREE.dict(text)]);
      if(d?.audio) draftAudio.set(norm(text), d.audio);
      addState.meanings = d?.meanings || null;
      senses = FREE.variants(tr, text).map(v=>({en:text, ru:v, ipa:d?.ipa||"", pos:d?.pos||"", audio:d?.audio||"", examples:(d?.examples||[]).map(x=>({...x})), free:true, enriched:true}));
    } else {
      const tr = await FREE.translate(text,"ru","en");
      senses = FREE.variants(tr, text).map(v=>({en:v, ru:text, examples:[], free:true, enriched:false}));
    }
    if(addState?.text!==text) return;
    addState.senses = senses; addState.loading=false;
    if(!senses.length) addState.error = "Словарь ничего не нашёл. Проверьте написание или введите перевод вручную.";
  }catch(e){
    if(addState?.text!==text) return;
    addState.loading=false; addState.error = lookupErrorText(e);
  }
  renderAdd();
}
function renderAdd(){
  const el = $("#addResult"); const st = addState;
  if(!st){ el.innerHTML=""; return; }
  let h = "";
  if(st.dup) h += `<div class="feedback no small">Такая карточка уже есть: <b>${esc(st.dup.en)} — ${esc(st.dup.ru)}</b></div>`;
  if(st.loading) h += `<div class="label">Ищу значения…</div><div class="senses"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`;
  if(st.error) h += `<div class="feedback no small">${esc(st.error)}</div>`;
  if(st.senses?.length){
    h += `<div class="label">Выберите подходящий перевод</div><div class="senses">`;
    st.senses.forEach((s,i)=>{
      const main = st.lang==="ru" ? s.en : s.ru;
      h += `<button type="button" class="sense" data-sense="${i}" aria-pressed="${st.sel===i}">
        <span class="t">${esc(main)} ${s.pos?`<span class="chip">${esc(s.pos)}</span>`:""} ${s.level?`<span class="chip">${esc(s.level)}</span>`:""}</span>
        ${s.meaning?`<span class="small muted">${esc(s.meaning)}</span>`:""}
        ${s.examples?.[0] && !s.free?`<span class="ex">${esc(s.examples[0].en)}</span>`:""}
      </button>`;
    });
    h += `</div>`;
    if(st.meanings?.length){
      h += `<details class="imp"><summary class="small">Значения в английском словаре</summary><ul class="ex-list small" style="margin-top:8px">${st.meanings.slice(0,4).map(m=>m.defs.slice(0,2).map(d=>`<li><span class="chip">${esc(m.pos)}</span><div>${esc(d.def)}${d.ex?`<div class="ru"><i>${esc(d.ex)}</i></div>`:""}</div></li>`).join("")).join("")}</ul></details>`;
    }
  }
  if(!st.loading){
    h += `<div class="stack" style="gap:8px">
      <label class="f">Свой вариант перевода<input class="input" id="manualTr" autocomplete="off" placeholder="${st.lang==="ru"?"English translation":"перевод на русский"}" value="${esc(st.manual||"")}"></label></div>`;
  }
  const c = currentDraft();
  if(c){
    h += `<div class="preview stack" style="gap:10px">
      <div class="row" style="justify-content:space-between;gap:8px"><div><div style="font-size:20px;font-weight:700">${esc(c.en)}</div>
      <div class="row" style="gap:8px">${c.ipa?`<span class="ipa">${esc(c.ipa)}</span>`:""}<span class="muted">${esc(c.ru)}</span></div></div>${sayBtn(c.en,"en",false)}</div>
      ${c.examples.length?`<ul class="ex-list">${c.examples.map(x=>`<li>${sayBtn(x.en)}<div><div class="en">${esc(x.en)}</div><div class="ru">${esc(x.ru||"")}</div></div></li>`).join("")}</ul>`
        : `<div class="row small muted">Примеров пока нет. <button type="button" class="btn ghost" id="fetchEx" style="min-height:32px;padding:4px 8px">Подобрать примеры</button></div>`}
      <button type="button" class="btn primary wide" id="saveCard">Сохранить карточку</button>
    </div>`;
  }
  el.innerHTML = h;
  el.querySelectorAll("[data-sense]").forEach(b=>b.onclick=async ()=>{
    st.sel=+b.dataset.sense; st.manual=""; st.manualEx=null; const v=st.senses[st.sel];
    if(v.free && !v.enriched){ // RU→EN: подтягиваем транскрипцию, аудио и примеры для выбранного английского слова
      v.enriched=true; renderAdd();
      const d=await FREE.dict(v.en);
      if(d){ v.ipa=d.ipa; v.pos=d.pos; v.audio=d.audio; v.examples=d.examples; if(d.audio) draftAudio.set(norm(v.en), d.audio); }
    }
    renderAdd(); autoSpeak(v.en,"en");
  });
  const m=$("#manualTr"); if(m){ m.oninput=()=>{ st.manual=m.value; if(m.value.trim()) { st.sel=-1; } refreshDraft(); }; }
  const fe=$("#fetchEx"); if(fe) fe.onclick=fetchManualExamples;
  const sv=$("#saveCard"); if(sv) sv.onclick=saveDraft;
}
let draftTimer=null;
function refreshDraft(){ clearTimeout(draftTimer); draftTimer=setTimeout(()=>{ const f=document.activeElement?.id; const pos=$("#manualTr")?.selectionStart; renderAdd(); if(f==="manualTr"){ const m=$("#manualTr"); m.focus(); try{ m.setSelectionRange(pos,pos); }catch{} } }, 250); }
function currentDraft(){
  const st=addState; if(!st) return null;
  if(st.manual?.trim()){
    const en = st.lang==="ru" ? st.manual.trim() : st.text, ru = st.lang==="ru" ? st.text : st.manual.trim();
    return { en, ru, ipa:st.manualEx?.ipa||"", pos:st.manualEx?.pos||"", audio:st.manualEx?.audio||"", examples:st.manualEx?.examples||[] };
  }
  if(st.sel>=0 && st.senses?.[st.sel]){
    const s=st.senses[st.sel];
    return { en: s.en, ru: st.lang==="ru" ? st.text : s.ru, ipa:s.ipa||"", pos:s.pos||"", note:s.meaning||"", audio:s.audio||"", examples:s.examples||[] };
  }
  return null;
}
async function fetchManualExamples(){
  const c=currentDraft(); if(!c) return;
  const b=$("#fetchEx"); b.disabled=true; b.textContent="Подбираю…";
  try{
    if(await getSample()){ const r=await askJSON(examplesPrompt([c]),"quick"); const x=Array.isArray(r)?r[0]:null; addState.manualEx = {ipa:x?.ipa||"", pos:x?.pos||"", examples:(x?.examples||[]).filter(e=>e?.en).slice(0,3)}; }
    else {
      const d=await FREE.dict(c.en);
      if(!d || !d.examples.length) toast("В словаре нет примеров для этого слова — их можно вписать в карточке вручную");
      if(d?.audio) draftAudio.set(norm(c.en), d.audio);
      addState.manualEx = {ipa:d?.ipa||"", pos:d?.pos||"", audio:d?.audio||"", examples:d?.examples||[]};
    }
  }
  catch(e){ toast(lookupErrorText(e)); }
  renderAdd();
}
async function saveDraft(){
  const d=currentDraft(); if(!d) return;
  if(d.examples.some(x=>!x.ru) && !(await getSample())){
    const b=$("#saveCard"); if(b){ b.disabled=true; b.textContent="Перевожу примеры…"; }
    d.examples = await FREE.translateExamples(d.examples.map(x=>({...x})));
  }
  const c=newCard(d); Store.saveCard(c);
  addState=null; addInput.value=""; $("#langBadge").hidden=true; renderAdd(); renderList();
  toast("Карточка «"+c.en+"» добавлена"); addInput.focus();
}

/* bulk import */
$("#impBtn").onclick = async ()=>{
  const lines = $("#impText").value.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const pairs=[];
  for(const l of lines){
    const p = l.split(/\s+[—–-]\s+|\t|;/).map(s=>s.trim()).filter(Boolean);
    if(p.length<2) continue;
    let [a,b]=p; if(isCyr(a)&&!isCyr(b)) [a,b]=[b,a];
    if(allCards().some(c=>norm(c.en)===norm(a))) continue;
    pairs.push({en:a, ru:b});
  }
  if(!pairs.length){ toast("Не нашла пар «слово — перевод»"); return; }
  const btn=$("#impBtn"); btn.disabled=true;
  const made = pairs.map(p=>newCard(p));
  if($("#impEx").checked && !(await getSample())){
    for(let i=0;i<made.length;i++){ // бесплатный словарь: транскрипция, аудио и английские примеры
      btn.textContent=`Словарь ${i+1}/${made.length}…`;
      const d=await FREE.dict(made[i].en);
      if(d){ Object.assign(made[i], {ipa:d.ipa, pos:d.pos, audio:d.audio, examples:d.examples}); }
    }
  } else if($("#impEx").checked){
    for(let i=0;i<made.length;i+=25){
      btn.textContent = `Примеры ${Math.min(i+25,made.length)}/${made.length}…`;
      const chunk = made.slice(i,i+25);
      try{
        const r = await askJSON(examplesPrompt(chunk),"quick");
        (Array.isArray(r)?r:[]).forEach(x=>{ const c=chunk[x?.i]; if(!c) return; c.ipa=x.ipa||""; c.pos=x.pos||""; c.examples=(x.examples||[]).filter(e=>e?.en).slice(0,3); });
      }catch(e){ toast(lookupErrorText(e)); break; }
    }
  }
  made.forEach(c=>Store.saveCard(c));
  btn.disabled=false; btn.textContent="Импортировать"; $("#impText").value="";
  toast(`Добавлено ${made.length} ${plural(made.length,"карточка","карточки","карточек")}`); renderList();
};

function streakInfo(){
  const days=Store.stats.days||{}; let n=0; let t=Date.now();
  if(!days[dayKey(t)]) t-=DAY;
  while(days[dayKey(t)]){ n++; t-=DAY; }
  const last7=[]; for(let i=6;i>=0;i--) last7.push(!!days[dayKey(Date.now()-i*DAY)]);
  return {n,last7};
}

/* ============ session engine ============ */
const FILLER = [["house","дом"],["window","окно"],["to borrow","одалживать"],["weather","погода"],["cheap","дешёвый"],["to arrive","прибывать"],["neighbour","сосед"],["to forget","забывать"],["kitchen","кухня"],["busy","занятой"],["to explain","объяснять"],["journey","поездка"]].map(([en,ru])=>({en,ru}));
let sess=null;
function modesOn(){ const m=S().modes; return m; }
function startLearn(){
  const list=allCards().filter(c=>!c.box).sort((a,b)=>a.created-b.created).slice(0,S().batch);
  if(list.length) buildSession("learn", list);
}
function startReview(){
  const list=allCards().filter(isDue).sort((a,b)=>a.due-b.due).slice(0,Math.max(30,S().batch*2));
  if(list.length) buildSession("review", list);
}
function buildSession(kind, list){
  const m=modesOn(), ids=list.map(c=>c.id), rounds=[];
  if(kind==="learn"){
    rounds.push({type:"intro", queue:ids.slice()});
    if(m.choice) rounds.push({type:"choice", dir:"fwd", queue:shuffle(ids)});
    if(m.match && ids.length>=2){ const sh=shuffle(ids), ch=[]; for(let i=0;i<sh.length;i+=5) ch.push(sh.slice(i,i+5)); if(ch.length>1 && ch[ch.length-1].length<2){ ch[ch.length-2].push(...ch.pop()); } rounds.push({type:"match", queue:ch}); }
    if(m.choice) rounds.push({type:"choice", dir:"rev", queue:shuffle(ids)});
    if(m.letters) rounds.push({type:"letters", queue:shuffle(ids)});
    if(m.typing) rounds.push({type:"typing", queue:shuffle(ids)});
    if(rounds.length===1) rounds.push({type:"choice", dir:"fwd", queue:shuffle(ids)});
  } else {
    if(m.choice || (!m.typing && !m.letters)) rounds.push({type:"choice", dir:"rev", queue:shuffle(ids)});
    if(m.typing) rounds.push({type:"typing", queue:shuffle(ids)});
    else if(m.letters) rounds.push({type:"letters", queue:shuffle(ids)});
  }
  sess={kind, ids, rounds, r:0, done:0, mistakes:Object.fromEntries(ids.map(i=>[i,0])), skipped:new Set(), answers:0, right:0, busy:false};
  sess.total = rounds.reduce((s,r)=>s+r.queue.length,0);
  $("#sess").hidden=false; document.body.style.overflow="hidden";
  next();
}
function cardOf(id){ return Store.cards.get(id); }
function front(c){ return S().first==="en" ? {t:c.en, l:"en"} : {t:c.ru, l:"ru"}; }
function back(c){ return S().first==="en" ? {t:c.ru, l:"ru"} : {t:c.en, l:"en"}; }
function updateBar(){ const p=sess.total?Math.round(sess.done/sess.total*100):0; $("#pbar").style.width=p+"%"; $("#sessCount").textContent=sess.done+"/"+sess.total; }
function next(){
  updateBar();
  while(sess.r<sess.rounds.length && !sess.rounds[sess.r].queue.length) sess.r++;
  if(sess.r>=sess.rounds.length) return finish();
  const round=sess.rounds[sess.r];
  sess.busy=false;
  ({intro:stepIntro, choice:stepChoice, match:stepMatch, letters:stepLetters, typing:stepTyping})[round.type](round, round.queue[0]);
}
function done(ok, id, requeue=true){
  const round=sess.rounds[sess.r]; round.queue.shift(); sess.done++;
  if(id!==undefined){ sess.answers++; if(ok) sess.right++; else { sess.mistakes[id]++; if(requeue){ round.queue.push(id); sess.total++; } } }
  next();
}
const MODE = {intro:"Знакомство", choice:"Выберите перевод", match:"Соедините пары", letters:"Соберите слово из букв", typing:"Напишите по-английски"};

function stepIntro(round, id){

function distractors(c, key, n=3){
  const pool = shuffle(allCards().filter(x=>x.id!==c.id && norm(x[key])!==norm(c[key])));
  const sessFirst = pool.sort((a,b)=>(sess.ids.includes(b.id)?1:0)-(sess.ids.includes(a.id)?1:0));
  const out=[]; const seen=new Set([norm(c[key])]);
  for(const x of [...sessFirst, ...shuffle(FILLER)]){ const v=x[key]; if(!seen.has(norm(v))){ seen.add(norm(v)); out.push(v); } if(out.length>=n) break; }
  return out;
}
function stepChoice(round, id){

function stepMatch(round, group){

  <div class="match"><div class="col">${left.map(c=>`<button class="mitem" data-l="${c.id}">${esc(front(c).t)}</button>`).join("")}</div>

  const B=body();

function stepTyping(round, id){

  const dueCount=allCards().filter(isDue).length, fresh=allCards().filter(c=>!c.box).length;
  body().innerHTML = `<div class="flash" style="gap:6px"><div class="label">${sess.kind==="learn"?"Обучение завершено":"Повторение завершено"}</div>
    <div class="bignum" style="font-size:52px">${acc}%</div><div class="muted">точность · ${rows.length} ${plural(rows.length,"слово","слова","слов")}</div></div>
    <div class="sum-list">${rows.map(r=>`<div class="sum-row"><b>${esc(r.c.en)}</b><span class="${r.m?"no":"ok"}">${r.skip?"уже знаю":r.m?`ошибок: ${r.m}`:"без ошибок"} · ${dueLabel(r.c)}</span></div>`).join("")}</div>
    <div class="sess-foot">${dueCount?`<button class="btn mark" id="more2">Повторить (${dueCount})</button>`:""}${fresh?`<button class="btn primary" id="more">Ещё ${Math.min(S().batch,fresh)} новых</button>`:""}<button class="btn" id="fin">Готово</button></div>`;
  $("#fin").onclick=closeSess;
  if($("#more")) $("#more").onclick=()=>{ sess=null; startLearn(); };
  if($("#more2")) $("#more2").onclick=()=>{ sess=null; startReview(); };
}

/* ============ progress ============ */
function renderStats(){
  const el=$("#v-stats"), cs=allCards();
  setTimeout(()=>bindGo(el));
  const cnt={new:0,learning:0,known:0}; cs.forEach(c=>cnt[status(c)]++);
  const due=cs.filter(isDue).length;
  const days=Store.stats.days||{}; let right=0,total=0; Object.values(days).forEach(d=>{right+=d.right||0; total+=d.total||0;});
  const st=streakInfo();
  // прогноз на 7 дней
  const fc=[]; for(let i=0;i<7;i++){ const s=startOfDay()+i*DAY, e=s+DAY; fc.push(cs.filter(c=>c.box>0 && (i===0 ? c.due<e : c.due>=s && c.due<e)).length); }
  const fmax=Math.max(1,...fc);
  const wd=["вс","пн","вт","ср","чт","пт","сб"];
  // активность 14 дней
  const act=[]; for(let i=13;i>=0;i--){ const t=Date.now()-i*DAY; act.push({t, n:days[dayKey(t)]?.n||0}); }
  const amax=Math.max(1,...act.map(a=>a.n));
  // распределение по уровням
  const byBox=Array(8).fill(0); cs.forEach(c=>byBox[c.box]++);
  const tot=Math.max(1,cs.length);
  el.innerHTML=`
  <div class="sec-head" style="margin-top:4px"><h2>Ваш прогресс</h2><button class="pill-link" data-go="learn">Учить</button></div>
  <div class="kpis">
    <div class="kpi"><b>${cs.length}</b><span>всего карточек</span></div>
    <div class="kpi"><b>${cnt.known}</b><span>выучено</span></div>
    <div class="kpi"><b>${cnt.learning}</b><span>в процессе</span></div>
    <div class="kpi"><b>${total?Math.round(right/total*100)+"%":"—"}</b><span>точность ответов</span></div>
  </div>
  <div class="panel stack" style="gap:10px">
    <div class="row" style="justify-content:space-between"><div class="label">Состояние колоды</div><span class="small muted">серия: ${st.n} ${plural(st.n,"день","дня","дней")}</span></div>
    <div class="stackbar" role="img" aria-label="Новые ${cnt.new}, учу ${cnt.learning}, выучено ${cnt.known}">
      <i style="width:${cnt.new/tot*100}%;background:var(--line)"></i><i style="width:${cnt.learning/tot*100}%;background:var(--pink)"></i><i style="width:${cnt.known/tot*100}%;background:var(--accent)"></i>
    </div>
    <div class="legend"><span style="--c:var(--line)">новые ${cnt.new}</span><span style="--c:var(--pink)">учу ${cnt.learning}</span><span style="--c:var(--accent)">выучено ${cnt.known}</span></div>
    <div class="small muted">Уровни 1–7: ${byBox.slice(1).map((n,i)=>`<span class="num">${i+1}: ${n}</span>`).join(" · ")}. Слово считается выученным с 4-го уровня, когда интервал повторения дошёл до 16 дней.</div>
  </div>
  <div class="panel">
    <div class="row" style="justify-content:space-between"><div class="label">Повторения на неделю</div><span class="small muted">сегодня: ${due}</span></div>
    <div class="bars">${fc.map((n,i)=>`<div class="bar"><em>${n||""}</em><i class="${i===0?"today":""}" style="height:${n/fmax*100}%"></i></div>`).join("")}</div>
    <div class="bar-labels">${fc.map((_,i)=>`<span>${i===0?"сег.":wd[new Date(Date.now()+i*DAY).getDay()]}</span>`).join("")}</div>
  </div>
  <div class="panel">
    <div class="row" style="justify-content:space-between"><div class="label">Активность за 2 недели</div><span class="small muted">слов в день</span></div>
    <div class="bars">${act.map((a,i)=>`<div class="bar"><em>${a.n||""}</em><i class="${i===13?"today":""}" style="height:${a.n/amax*100}%"></i></div>`).join("")}</div>
    <div class="bar-labels">${act.map(a=>`<span>${new Date(a.t).getDate()}</span>`).join("")}</div>
  </div>
  <div class="panel stack" style="gap:8px">
    <div class="label">Трудные слова</div>
    ${(()=>{ const hard=cs.filter(c=>c.lapses>0).sort((a,b)=>b.lapses-a.lapses).slice(0,6); return hard.length? hard.map(c=>`<div class="row" style="justify-content:space-between"><span><b>${esc(c.en)}</b> <span class="muted">— ${esc(c.ru)}</span></span><span class="chip">забыто ${c.lapses}×</span></div>`).join("") : `<div class="muted small">Пока нет: сюда попадут слова, которые забылись при повторении.</div>`; })()}
  </div>`;
}

/* ============ settings ============ */
function renderPrefs(){
  const s=S(), el=$("#v-prefs");
  const en=voices.filter(v=>/^en/i.test(v.lang)), hasRu=voices.some(v=>/^ru/i.test(v.lang));
  const seg=(key,opts)=>`<div class="seg" data-seg="${key}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${s[key]===v}">${l}</button>`).join("")}</div>`;
  const sw=(k,l,d)=>`<div class="setrow"><div class="lbl"><b>${l}</b><span>${d}</span></div><label class="switch"><input type="checkbox" data-mode="${k}" ${s.modes[k]?"checked":""} aria-label="${l}"><span></span></label></div>`;
  el.innerHTML=`
  <div class="sec-head" style="margin-top:4px"><h2>Настройки</h2></div>
  <div class="panel">
    <div class="label" style="margin-bottom:4px">Обучение</div>
    <div class="setrow"><div class="lbl"><b>Слов за одну тренировку</b><span>от 5 до 25</span></div><div class="range"><input type="range" id="batch" min="5" max="25" value="${s.batch}" aria-label="Слов за тренировку"><output id="batchOut">${s.batch}</output></div></div>
    <div class="setrow"><div class="lbl"><b>Сначала показывать</b><span>язык лицевой стороны карточки</span></div>${seg("first",[["en","English"],["ru","Русский"]])}</div>
  </div>
  <div class="panel">
    <div class="label" style="margin-bottom:4px">Форматы упражнений</div>
    ${sw("choice","Выбор перевода","4 варианта, в обе стороны")}
    ${sw("match","Сопоставление пар","до 5 пар на экране")}
    ${sw("letters","Сборка из букв","слово собирается из перемешанных букв")}
    ${sw("typing","Ввод с клавиатуры","без подсказки буквами")}
  </div>
  <div class="panel">
    <div class="label" style="margin-bottom:4px">Произношение</div>
    <div class="setrow"><div class="lbl"><b>Озвучивать автоматически</b><span>${hasRu?"":"русский голос в этом браузере не найден"}</span></div>${seg("audio",[["off","Нет"],["en","English"],["both","Оба языка"]])}</div>
    <div class="setrow"><div class="lbl"><b>Записи носителей</b><span>если в словаре есть аудио, играть его вместо синтеза речи</span></div><label class="switch"><input type="checkbox" id="native" ${s.native!==false?"checked":""} aria-label="Записи носителей"><span></span></label></div>
    <div class="setrow"><div class="lbl"><b>Скорость речи</b><span>${s.rate.toFixed(1)}×</span></div><div class="range"><input type="range" id="rate" min="0.6" max="1.2" step="0.1" value="${s.rate}" aria-label="Скорость речи"></div></div>
    <div class="setrow"><div class="lbl"><b>Английский голос</b><span>${en.length?en.length+" доступно":"голоса загружаются или недоступны"}</span></div>
      <div class="row" style="flex-wrap:nowrap"><select class="input" id="voice" style="max-width:190px;min-height:40px">${`<option value="">Автовыбор (британский)</option>`+en.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===s.voice?"selected":""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("")}</select>${sayBtn("Nice to meet you","en",false)}</div></div>
  </div>
  <div class="panel">
    <div class="label" style="margin-bottom:4px">Данные</div>
    <div class="setrow"><div class="lbl"><b>Хранение</b><span>${Store.cloud?"в вашем аккаунте Claude, видно с любого устройства":"только в этом браузере — для переноса используйте резервную копию"}</span></div></div>
    <div class="setrow"><div class="lbl"><b>Источник переводов</b><span>${SOURCE==="claude"?"Claude":"MyMemory + Free Dictionary API"}</span></div></div>
    ${SOURCE==="free"?`<div class="setrow" style="flex-wrap:wrap"><div class="lbl"><b>Email для MyMemory</b><span>необязательно: без него около 5 000 символов перевода в день, с ним — около 50 000. Отправляется только в MyMemory.</span></div><input class="input" id="mmEmail" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(s.mmEmail||"")}" style="max-width:260px"></div>`:""}
    <div class="setrow"><div class="lbl"><b>Резервная копия</b><span>скопировать колоду как JSON или вставить ранее сохранённую</span></div><div class="row"><button class="btn" id="exp">Копировать</button><button class="btn" id="imp">Вставить</button></div></div>
    <div class="setrow"><div class="lbl"><b>Очистить колоду</b><span>удалить все карточки и статистику</span></div><button class="btn danger" id="wipe">Очистить</button></div>
    <div id="dataArea"></div>
  </div>`;
  const save=()=>{ Store.saveSettings(); };
  $("#batch").oninput=e=>{ s.batch=+e.target.value; $("#batchOut").textContent=s.batch; };
  $("#batch").onchange=save;
  $("#rate").onchange=e=>{ s.rate=+e.target.value; save(); renderPrefs(); speak("Nice to meet you","en"); };
  $("#voice").onchange=e=>{ s.voice=e.target.value; save(); tts("Nice to meet you","en"); };
  $("#native").onchange=e=>{ s.native=e.target.checked; save(); };
  if($("#mmEmail")) $("#mmEmail").onchange=e=>{ s.mmEmail=e.target.value.trim(); save(); toast(s.mmEmail?"Email сохранён":"Email убран"); };
  el.querySelectorAll("[data-seg]").forEach(g=>g.onclick=e=>{ const b=e.target.closest("button"); if(!b) return; s[g.dataset.seg]=b.dataset.v; save(); renderPrefs(); });
  el.querySelectorAll("[data-mode]").forEach(i=>i.onchange=()=>{ s.modes[i.dataset.mode]=i.checked; if(!Object.values(s.modes).some(Boolean)){ s.modes.choice=true; toast("Хотя бы один формат нужен — оставила выбор перевода"); renderPrefs(); } save(); });
  $("#exp").onclick=()=>{
    const json=JSON.stringify({cards:allCards(), stats:Store.stats},null,0);
    const done=()=>toast("Колода скопирована");
    const fallback=()=>{ $("#dataArea").innerHTML=`<textarea class="input" id="expText" readonly>${esc(json)}</textarea><p class="small muted">Выделите текст и скопируйте вручную.</p>`; $("#expText").select(); };
    try{ navigator.clipboard.writeText(json).then(done,fallback); }catch{ fallback(); }
  };
  $("#imp").onclick=()=>{
    $("#dataArea").innerHTML=`<div class="stack" style="gap:8px;margin-top:8px"><textarea class="input" id="impJson" placeholder="Вставьте сюда скопированный JSON"></textarea><button class="btn primary" id="impGo">Добавить в колоду</button></div>`;
    $("#impGo").onclick=()=>{ try{ const d=JSON.parse($("#impJson").value); let n=0; (d.cards||[]).forEach(c=>{ if(c?.id&&c.en&&c.ru){ Store.saveCard(c); n++; } }); if(d.stats?.days){ Store.stats.days={...d.stats.days, ...Store.stats.days}; Store.saveStats(); } toast(`Загружено ${n} ${plural(n,"карточка","карточки","карточек")}`); renderAll(); }catch{ toast("Не получилось прочитать JSON — проверьте, что скопирован целиком"); } };
  };
  $("#wipe").onclick=()=>{
    $("#dataArea").innerHTML=`<div class="feedback no" style="margin-top:8px"><div style="margin-bottom:8px">Удалить ${Store.cards.size} ${plural(Store.cards.size,"карточку","карточки","карточек")} и всю статистику?</div><div class="row"><button class="btn" id="wn">Отмена</button><button class="btn primary" id="wy" style="background:var(--bad);border-color:var(--bad)">Удалить всё</button></div></div>`;
    $("#wn").onclick=()=>$("#dataArea").innerHTML="";
    $("#wy").onclick=()=>{ [...Store.cards.keys()].forEach(id=>Store.deleteCard(id)); Store.stats={days:{}}; Store.saveStats(); renderAll(); toast("Колода очищена"); };
  };
}

/* ============ routing ============ */
let view="learn";
const VIEWS=["learn","words","stats","prefs"];
function go(v){
  if(!VIEWS.includes(v)) v="learn"; view=v;
  VIEWS.forEach(x=>$("#v-"+x).hidden = x!==v);
  $("#tabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-current", b.dataset.view===v?"page":"false"));
  try{ history.replaceState(null,"","#"+v); }catch{}
  renderView(); window.scrollTo(0,0);
}
function renderView(){ ({learn:renderLearn, words:renderList, stats:renderStats, prefs:renderPrefs})[view](); }
function renderAll(){ renderView(); setSync(); }
$("#toLearn").onclick=()=>go("learn");
$("#tabs").onclick=e=>{ const b=e.target.closest("button"); if(b) go(b.dataset.view); };

/* ============ boot ============ */
Store.loadLocal();
go((location.hash||"").slice(1));
setSync(); renderSourceNote();
Store.connect().then(()=>{ if(!sess) renderAll(); else setSync(); });
</script>
